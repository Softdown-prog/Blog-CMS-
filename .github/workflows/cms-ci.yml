name: Blog CMS - build e SAC
on:
  push:
    branches: ['main', 'feat/cms-postgres-public-posts']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    # Bootstrap no runner descartável: não consumir RAM da VPS antes da homologação.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cms_test
          POSTGRES_PASSWORD: cms_ci_only
          POSTGRES_DB: blog_cms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms_test -d blog_cms_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout CMS
        uses: actions/checkout@v4
      - name: Checkout SAC / Data_libray (commit fixo)
        uses: actions/checkout@v4
        with:
          repository: Softdown-prog/Data_libray
          ref: 3a36bac3fd3a59520fa6ee49bb1e390174368d03
          path: _sac
          persist-credentials: false
      - name: Node compatível com Angular 22
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Gerar locks de bootstrap (não reprodutíveis até versionar)
        run: |
          npm install --prefix apps/web --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix apps/api --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Instalar dependências CMS a partir dos locks
        run: |
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/api --ignore-scripts --no-audit --no-fund
      - name: Compilar backend NestJS
        run: npm run build --prefix apps/api
      - name: Testes do backend (consultas PostgreSQL simuladas)
        run: npm test --prefix apps/api
      - name: PostgreSQL 18 descartável - migrations, transações e concorrência
        env:
          PG_INTEGRATION_URL: postgres://cms_test:cms_ci_only@127.0.0.1:5432/blog_cms_ci
        run: npm run test:postgres --prefix apps/api
      - name: Instalar ferramentas SAC isoladas
        run: |
          npm ci --prefix _sac/packages/angular-core --ignore-scripts --no-audit --no-fund
          npm ci --prefix _sac/packages/angular-precompiler --ignore-scripts --no-audit --no-fund
          npm ci --prefix _sac/packages/angular-postcompiler --ignore-scripts --no-audit --no-fund
      - name: SAC-PRE001 + Angular AOT + SAC-P001
        run: node scripts/sac-build.mjs
      - name: Instalar Chromium para testes reais (runner temporário)
        run: |
          cd apps/web
          npx --no-install playwright install --with-deps chromium
      - name: Playwright - editor no Chromium desktop e mobile emulado
        run: npm run test:e2e --prefix apps/web
      - name: Salvar evidência e locks de bootstrap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-cms-foundation-evidence
          path: |
            reports/sac-static.json
            apps/web/package-lock.json
            apps/api/package-lock.json
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore


